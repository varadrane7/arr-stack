services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: $TZ
    ports:
      - "5055:5055"
    volumes:
      - $DOCKERDIR/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: "no"